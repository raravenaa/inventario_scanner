<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      html, body { min-height: 660px; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 0; margin: 0; }
      .wrap { padding: 12px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button { min-height: 42px; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; background: white; }
      button:disabled { opacity: 0.55; }
      #btnTorch { grid-column: 1 / -1; }
      #reader { width: 100%; min-height: 390px; margin-top: 12px; overflow: hidden; border-radius: 8px; background: #111; }
      #reader video { width: 100% !important; border-radius: 8px; }
      .hint { margin-top: 10px; font-size: 12px; color: #666; }
      .code { margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="row">
        <button id="btnStart">Iniciar camara</button>
        <button id="btnStop">Detener</button>
        <button id="btnTorch" disabled>Linterna no disponible</button>
      </div>
      <div id="reader"></div>
      <div class="hint">Consejo: usa buena luz y centra el codigo de barras en horizontal.</div>
      <div class="code" id="last"></div>
      <div class="hint error" id="error"></div>
    </div>
    <script src="./scanner.js?v=7"></script>
  </body>
</html>
